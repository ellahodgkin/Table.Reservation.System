<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="practicestyles.css">
    <title>Table Reservation System - Practice</title>
</head>
<body>
    <div id="nav-container">
        <div id="nav-links">
            <a href="index.html" class="nav-link"> Admin View </a>
            <a href="customer.html" class="nav-link"> Customer View </a>
            <a href="practice.html" class="nav-link"> Practice View </a>
        </div>
    </div>
    <div > 
        <h3 id="title"> Table Reservation System: </h3>

        <form id="dev-form">

            <label for="name"> Name: </label>
            <input id="name" class="data-input-initial" name="name" type="text"> <br />


            <label for="date"> Date: </label>
            <input id="date" class="data-input-initial" type="date"> <br />

            <label for="time"> Time: </label>
            <select id="time" class="data-input-initial" ></select> <br />

            <label for="guests"> Guests: </label>
            <select id="guests" class="data-input-initial" ></select> <br />

            <input id="submit" class="submit-btn" type="submit" value="Submit"> 
        </form>
    </div>

    <div id="result"></div>
    
    <div id="current-reservation-presentation">
        <h5 id="reservation-list-title"> Current Reservations: </h5>

        <div id="reservations-list"></div>
    </div>

    <div id="practice-tables-presentation"> 
        <h5 id="practice-list-title"> Practice Reservations: </h5>
        <div id="practice-tables-floor">
                <div class="practice-tables rectangle" id="table-1"> Table 1</div>
                <div class="practice-tables rectangle" id="table-2"> Table 2</div>
                <div class="practice-tables square" id="table-3"> Table 3</div>
                <div class="practice-tables square" id="table-4"> Table 4</div>
                <div class="practice-tables square" id="table-5"> Table 5</div>
                <div class="practice-tables square" id="table-6"> Table 6</div>
                <div class="practice-tables circle" id="table-7"> Table 7</div> 
                <div class="practice-tables circle" id="table-8"> Table 8</div>
                <div class="practice-tables circle" id="table-9"> Table 9</div>
                <div class="practice-tables circle" id="table-10"> Table 10</div>
        </div>
    </div>
    <script src="shared.js"></script>
    <script src="admin.js"></script>
</body>
</html>
