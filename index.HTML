<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Table Reservation System - Admin</title>
</head>
<body>
    <div id="nav-container">
        <div id="nav-links">
            <a href="index.html" class="nav-link"> Admin View </a>
            <a href="customer.html" class="nav-link"> Customer View </a>
        </div>
    </div>
    <div > 
        <h3 id="title"> Table Reservation System: </h3>

        <form id="dev-form">

            <label for="name"> Name: </label>
            <input id="name" class="data-input-initial" name="name" type="text"> <br />


            <label for="date"> Date: </label>
            <input id="date" class="data-input-initial" type="date"> <br />

            <label for="time"> Time: </label>
            <select id="time" class="data-input-initial" ></select> <br />

            <label for="guests"> Guests: </label>
            <select id="guests" class="data-input-initial" ></select> <br />

            <input id="submit" class="submit-btn" type="submit" value="Submit"> 
        </form>
    </div>

    <div id="result"></div>
    
    <div id="current-reservation-presentation">
        <h5 id="reservation-list-title"> Current Reservations: </h5>

        <div id="reservations-list"></div>
    </div>

    <div id="display-buttons-container">
        <button id="show-calendar-btn"> Show Calendar </button>
        <button id="show-tables-btn"> Show Tables </button>
    </div>

    <div id="tables-presentation"> 
        <h5 id="list-title"> Practice Reservations: </h5>
        <div id="tables-floor">

        </div>
    </div>

    <div id="calendar-view">
        <h5 id="calendar-title">Calendar View:</h5>

        <div id="calendar-date-select-container">
            <label for="calendar-date-select"><strong>Select Date:</strong></label>
            <input type="date" id="calendar-date-select">
        </div>
        
        <div id="calendar">
            <div class="calendar-row">
                <div class="calendar-row-label">Time</div>
                    <div class="calendar-grid">
                        <div class="calendar-header-time-slot">12:00</div>
                        <div class="calendar-header-time-slot">12:30</div>
                        <div class="calendar-header-time-slot">13:00</div>
                        <div class="calendar-header-time-slot">13:30</div>
                        <div class="calendar-header-time-slot">14:00</div>
                        <div class="calendar-header-time-slot">14:30</div>
                        <div class="calendar-header-time-slot">15:00</div>
                        <div class="calendar-header-time-slot">15:30</div>
                        <div class="calendar-header-time-slot">16:00</div>
                        <div class="calendar-header-time-slot">16:30</div>
                        <div class="calendar-header-time-slot">17:00</div>
                        <div class="calendar-header-time-slot">17:30</div>
                        <div class="calendar-header-time-slot">18:00</div>
                        <div class="calendar-header-time-slot">18:30</div>
                        <div class="calendar-header-time-slot">19:00</div>
                        <div class="calendar-header-time-slot">19:30</div>
                        <div class="calendar-header-time-slot">20:00</div>
                    </div>
            </div> 


            
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="admin.js"></script>
</body>
</html>
